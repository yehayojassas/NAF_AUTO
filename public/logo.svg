<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 68" fill="none">
  <!-- NAF: orange stroke halo + white fill -->
  <text x="2" y="44"
    font-family="Arial Black, Impact, sans-serif"
    font-size="46"
    font-weight="900"
    font-style="italic"
    stroke="#F97316"
    stroke-width="8"
    stroke-linejoin="round"
    paint-order="stroke fill"
    fill="white"
    letter-spacing="-1"
  >NAF</text>

  <!-- Orange line -->
  <rect x="2" y="50" width="206" height="2.5" fill="#F97316" rx="1"/>

  <!-- AUTOMOBILES -->
  <text x="2" y="65"
    font-family="Arial, Helvetica, sans-serif"
    font-size="13"
    font-weight="700"
    fill="white"
    letter-spacing="4"
  >AUTOMOBILES</text>

  <!-- SA superscript -->
  <text x="172" y="60"
    font-family="Arial, Helvetica, sans-serif"
    font-size="9"
    font-weight="700"
    fill="white"
    letter-spacing="1"
  >SA</text>
</svg>
